<div class="file-input-wrapper" [class.disabled]="isDisabled">
    <button type="button" class="upload-btn" (click)="fileInput.click()" [disabled]="isDisabled">
        {{ value ? 'Change Image' : 'Upload Image' }}
    </button>
    <input type="file" accept="image/png, image/jpeg" #fileInput (change)="onFileSelected($event)" hidden />
    @if (value) {
    <img [src]="value" alt="Preview" class="preview-img" />
    }
</div>
